name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (required for ANTLR4)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDKs (9/10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Verify vendored ANTLR tool JAR
        run: test -f build/antlr/antlr4-4.13.1-complete.jar

      - name: Restore
        run: dotnet restore OutWit.slnx

      # A shipped database library must not carry known-vulnerable packages. This caught
      # System.Security.Cryptography.Xml 9.0.0 (seven high-severity advisories) reaching every
      # consumer through Microsoft.EntityFrameworkCore.Design.
      #
      # Scoped to the packable projects on purpose: the benchmarks reference SQLite to compare
      # against it, and the samples carry their own web dependencies. Neither is shipped, so an
      # advisory there must not block a release of the library.
      - name: Check shipped packages for vulnerabilities
        run: |
          status=0
          for proj in \
            Sources/Core/OutWit.Database.Core/OutWit.Database.Core.csproj \
            Sources/Core/OutWit.Database.Core.BouncyCastle/OutWit.Database.Core.BouncyCastle.csproj \
            Sources/Core/OutWit.Database.Core.IndexedDb/OutWit.Database.Core.IndexedDb.csproj \
            Sources/Engine/OutWit.Database.Parser/OutWit.Database.Parser.csproj \
            Sources/Engine/OutWit.Database/OutWit.Database.csproj \
            Sources/Providers/OutWit.Database.AdoNet/OutWit.Database.AdoNet.csproj \
            Sources/Providers/OutWit.Database.EntityFramework/OutWit.Database.EntityFramework.csproj
          do
            report=$(dotnet list "$proj" package --vulnerable --include-transitive 2>&1)
            echo "$report"
            if echo "$report" | grep -q "has the following vulnerable packages"; then
              echo "::error file=$proj::Vulnerable package in a shipped project"
              status=1
            fi
          done
          exit $status

      - name: Build
        run: dotnet build OutWit.slnx --configuration Release --no-restore

      # The nuspecs must list only real runtime dependencies. Microsoft.EntityFrameworkCore.Design
      # and Antlr4BuildTasks are build/design-time only; when they leaked, every consumer of the SQL
      # engine restored Roslyn, MSBuild and a net472 build host into bin/.
      #
      # Release sets GeneratePackageOnBuild, so the packages already exist by now - packing again
      # here would rebuild and is what made this step fail on its first run.
      - name: Assert no build-time dependency leaked into a package
        run: |
          status=0
          found=0
          while IFS= read -r pkg; do
            found=1
            nuspec=$(unzip -p "$pkg" '*.nuspec')
            for banned in Microsoft.EntityFrameworkCore.Design Antlr4BuildTasks; do
              if echo "$nuspec" | grep -q "id=\"$banned\""; then
                echo "::error::$(basename "$pkg") declares a dependency on $banned"
                status=1
              fi
            done
          done < <(find Sources -path "*/bin/Release/*.nupkg" ! -name "*.snupkg")

          if [ "$found" -eq 0 ]; then
            echo "::error::No packages found under Sources/**/bin/Release - the assertion would pass vacuously"
            status=1
          fi
          exit $status

      # Category!=Performance excludes the wall-clock assertions under Performance/. They measure
      # machine load rather than code - a scaling ratio on a shared runner says nothing - so they
      # are quarantined here rather than allowed to produce noise.
      #
      # Category!=Conformance excludes the EF Core specification suites, which are known red: they
      # are an information source, and every one of them that goes green gets its exclusion removed
      # along with the gap it was reporting. WitComplianceTest is deliberately NOT tagged, so the
      # baseline of unimplemented suites is still enforced on every run.
      #
      # Category!=Oracle excludes the same suites run against SQLite. They are a control, not a
      # verdict on this code: their job is to tell a WitDatabase defect apart from something the
      # specification model asks of every provider, and they are consulted when a conformance suite
      # is red rather than gating anything.
      #
      # Coverage is collected because coverlet.collector is referenced by all seven test projects
      # and was never invoked. It is reported, not gated: a threshold on a suite whose assertions
      # are known to miss defects would measure the wrong thing, and this project has the evidence -
      # nine behaviours changed during the 2026-07 audit without a single test failing.
      - name: Test
        run: dotnet test OutWit.slnx --configuration Release --no-build --verbosity normal --filter "Category!=Performance&Category!=Conformance&Category!=Oracle" --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Summarise coverage
        if: always()
        run: |
          shopt -s globstar nullglob
          files=(TestResults/**/coverage.cobertura.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No coverage files produced"
            exit 0
          fi
          {
            echo "### Line coverage"
            echo
            echo "| Assembly | Covered | Total | % |"
            echo "|---|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - "${files[@]}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from collections import defaultdict
          hits = defaultdict(lambda: [0, 0])
          for path in sys.argv[1:]:
              for package in ET.parse(path).getroot().iter("package"):
                  name = package.get("name", "?")
                  for line in package.iter("line"):
                      hits[name][1] += 1
                      if int(line.get("hits", "0")) > 0:
                          hits[name][0] += 1
          total_covered = total_lines = 0
          for name, (covered, lines) in sorted(hits.items()):
              total_covered += covered
              total_lines += lines
              pct = (100.0 * covered / lines) if lines else 0.0
              print(f"| {name} | {covered} | {lines} | {pct:.1f} |")
          pct = (100.0 * total_covered / total_lines) if total_lines else 0.0
          print(f"| **Total** | **{total_covered}** | **{total_lines}** | **{pct:.1f}** |")
          PY

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: ignore

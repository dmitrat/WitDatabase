name: Publish Package
run-name: "Publish Package: ${{ inputs.project }}"

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to publish (equals .csproj base name)'
        required: true
        type: choice
        options:
          - OutWit.Database.Core
          - OutWit.Database.Core.BouncyCastle
          - OutWit.Database.Core.IndexedDb
          - OutWit.Database.Parser
          - OutWit.Database
          - OutWit.Database.AdoNet
          - OutWit.Database.EntityFramework
      pushToNuGet:
        description: 'Push to nuget.org'
        type: boolean
        required: true
        default: true
      pushToGitHubPackages:
        description: 'Push to GitHub Packages'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write
  # Lets GitHub mint the OIDC token that nuget.org exchanges for a short-lived
  # key. Without it the exchange fails quietly rather than loudly, which is the
  # one failure worth naming here.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ github.event.inputs.project }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The version guard below compares the packed version against the tag on HEAD,
          # which a shallow checkout does not fetch.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Java (required for ANTLR4)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDKs (9/10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.slnx', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Resolve project path
        id: paths
        shell: bash
        run: |
          name="${{ env.PROJECT }}"
          lib=$(find . -name "$name.csproj" -type f | head -1)
          if [ -z "$lib" ]; then
            echo "Library project '$name.csproj' not found"
            exit 1
          fi
          echo "libCsproj=$lib" >> $GITHUB_OUTPUT
          echo "Resolved: $lib"

      - name: Build (all target frameworks)
        run: dotnet build "${{ steps.paths.outputs.libCsproj }}" -c Release -p:ContinuousIntegrationBuild=true

      - name: Pack (no build)
        run: dotnet pack "${{ steps.paths.outputs.libCsproj }}" -c Release --no-build

      - name: Collect packages
        id: collect
        shell: bash
        run: |
          mkdir -p NuGet
          find . -path "*/bin/Release/*.nupkg" -exec cp {} NuGet/ \;
          find . -path "*/bin/Release/*.snupkg" -exec cp {} NuGet/ \;
          
          hasNupkg=$(ls NuGet/*.nupkg 2>/dev/null | wc -l)
          hasSnupkg=$(ls NuGet/*.snupkg 2>/dev/null | wc -l)
          
          echo "hasNupkg=$([[ $hasNupkg -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "hasSnupkg=$([[ $hasSnupkg -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          
          echo "Collected packages:"
          ls -la NuGet/

      # Guard added 2026-07-29 after a release shipped the wrong version silently.
      #
      # OutWit.Database was packed as 2.4.0 because a csproj version bump had been reverted by
      # accident. nuget.org answered "Conflict - already exists", `--skip-duplicate` swallowed it,
      # and the workflow reported SUCCESS having published nothing. The next package in the chain
      # then shipped for real with a dependency on the stale version.
      #
      # So: if HEAD carries a release tag, the packed version must equal it, or nothing is pushed.
      - name: Verify packed version matches the release tag
        shell: bash
        run: |
          set -euo pipefail
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          echo "tag: ${tag:-<none>}"

          if [ -z "$tag" ]; then
            echo "::warning::HEAD carries no release tag - version guard skipped."
            exit 0
          fi

          # Every collected package, not just the named one: a build can pack project references
          # too, and all of them come from this commit so all of them must carry this version.
          bad=0
          for pkg in NuGet/*.nupkg; do
            name=$(basename "$pkg" .nupkg)
            version=$(echo "$name" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+.*$' || true)
            echo "  packed: $name  (version $version)"
            if [ "$version" != "${tag#v}" ]; then
              echo "::error::$name does not carry the tagged version ${tag#v}. Refusing to push - fix the <Version> in the csproj."
              bad=1
            fi
          done
          [ "$bad" = "0" ] || exit 1
          echo "Version guard OK - everything matches $tag."

      - name: Add GitHub Packages source
        if: github.event.inputs.pushToGitHubPackages == 'true'
        run: >
          dotnet nuget add source
          --username ${{ github.actor }}
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      # The runner proves to nuget.org which workflow is asking, nuget.org checks that against its
      # policy and returns a key valid for an hour. Nothing long-lived exists to leak, and nothing
      # has to be rotated on a calendar.
      - name: Authenticate to nuget.org (trusted publishing)
        id: login
        if: github.event.inputs.pushToNuGet == 'true' && (steps.collect.outputs.hasNupkg == 'true' || steps.collect.outputs.hasSnupkg == 'true')
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # --skip-duplicate is kept so a partially-failed chain can be re-run, but a skip is no longer
      # silent: if every package we meant to push already existed, this run published nothing and
      # saying "success" would be a lie.
      - name: Push to nuget.org (.nupkg)
        if: github.event.inputs.pushToNuGet == 'true' && steps.collect.outputs.hasNupkg == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out=$(dotnet nuget push "NuGet/*.nupkg"             --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"             --source https://api.nuget.org/v3/index.json             --skip-duplicate 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          if echo "$out" | grep -q "already exists at feed" && ! echo "$out" | grep -q "Your package was pushed"; then
            echo "::error::Nothing was published - the package already exists at the feed. This usually means the version was not bumped."
            exit 1
          fi

      - name: Push symbols to nuget.org (.snupkg)
        if: github.event.inputs.pushToNuGet == 'true' && steps.collect.outputs.hasSnupkg == 'true'
        run: >
          dotnet nuget push "NuGet/*.snupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push to GitHub Packages (.nupkg)
        if: github.event.inputs.pushToGitHubPackages == 'true' && steps.collect.outputs.hasNupkg == 'true'
        run: >
          dotnet nuget push "NuGet/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source github
          --skip-duplicate

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT }}-nuget
          path: NuGet/*
          retention-days: 7

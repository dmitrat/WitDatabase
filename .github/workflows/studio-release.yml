name: studio-release

# Packages WitDatabase Studio for Windows, Linux and macOS via Avalonia Parcel and
# attaches the artifacts to a GitHub Release. Modelled on the WitCloud client pipeline.
#
# Two tracks per OS (6 artifacts): a self-contained build (bundles the .NET runtime,
# nothing to install) and a framework-dependent build (SelfContained=false, needs the
# .NET 10 Runtime on the target) whose files carry a "-no-dotnet" suffix.
#
# Trigger: a `studio-v*` tag — DELIBERATELY separate from the engine's `v*` tag. The
# previous workflow derived its tag from the csproj version and published Studio as
# `v1.0.1`, sitting in the same list as the engine's `v12.2.0`. They are different
# products on different version lines and they now have different namespaces.
#
# Native runner per OS (windows-latest / ubuntu-latest / macos-14 arm64) so each RID
# builds natively — required for the macOS bundle and for per-OS code-signing.
#
# NOT BUILT, stated rather than left to be discovered: osx-x64. The workflow this
# replaces offered it and never ran it (buildMacOS defaulted to false, so no macOS job
# has ever executed and release v1.0.1 shipped win-x64 and linux-x64 only). Apple Silicon
# is the target that matters first; add an osx-x64 matrix entry when Intel Macs need it.
#
# Signing, and what happens without it. Every signing step is a no-op when its secrets
# are absent, so the release still ships unsigned rather than failing:
#   macOS   — Developer-ID + notarization when APPLE_* are set; otherwise Parcel's
#             ad-hoc signature, which runs locally but shows Gatekeeper warnings.
#   Linux   — GPG-signed SHA256SUMS when GPG_PRIVATE_KEY is set; the plain SHA256SUMS
#             is written either way.
#   Windows — Authenticode via SSL.com eSigner. The tier is quota-limited (~240/yr), so
#             it signs every tag EXCEPT -dev/-test/-internal. sign=true forces it.
#
# Convention, same as the WitCloud client: tag `-dev` for internal iteration (unsigned on
# Windows), `-beta` for a public release (signed).
#
# Repository secrets:
#   PARCEL_LICENSE_KEY    — Avalonia Parcel license key (AvaloniaUI Portal). REQUIRED.
#   APPLE_CERT_P12_BASE64 / APPLE_CERT_PASSWORD / APPLE_ID / APPLE_APP_PASSWORD /
#   APPLE_TEAM_ID         — macOS Developer-ID signing + notarization. Optional.
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE — Linux SHA256SUMS signing. Optional.
#   ESIGNER_USERNAME / ESIGNER_PASSWORD / ESIGNER_CREDENTIAL_ID / ESIGNER_TOTP_SECRET
#                         — Windows Authenticode. Optional.

on:
  push:
    tags:
      - 'studio-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 2.0.0-beta). Blank = derive from tag, or 0.0.0-dev on a manual run.'
        required: false
        default: ''
      sign:
        description: 'Force Windows code-signing for this run (consumes SSL.com eSigner signatures).'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark the GitHub Release as a pre-release.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  PARCEL_PROJECT: Tools/OutWit.Database.Studio/OutWit.Database.Studio.parcel
  PARCEL_OUT: Tools/OutWit.Database.Studio/bin/packages

jobs:
  build:
    name: pack ${{ matrix.oslabel }} (${{ matrix.track }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # macOS has never been built for this application, so it must not be able to block a
    # release that the two proven platforms produce. Tighten to false once it is green.
    continue-on-error: ${{ matrix.os == 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            packages: nsis zip
            track: selfcontained
            suffix: ""
            oslabel: windows-x64
          - os: windows-latest
            rid: win-x64
            packages: nsis zip
            track: framework
            suffix: "-no-dotnet"
            oslabel: windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            packages: deb zip
            track: selfcontained
            suffix: ""
            oslabel: linux-x64
          - os: ubuntu-latest
            rid: linux-x64
            packages: deb zip
            track: framework
            suffix: "-no-dotnet"
            oslabel: linux-x64
          - os: macos-14
            rid: osx-arm64
            packages: zip
            track: selfcontained
            suffix: ""
            oslabel: macos-arm64
          - os: macos-14
            rid: osx-arm64
            packages: zip
            track: framework
            suffix: "-no-dotnet"
            oslabel: macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ANTLR4 generates the SQL parser during the engine build, which Studio references.
      - name: Setup Java (required for ANTLR4)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#studio-v}"
          else
            V="0.0.0-dev"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

          # CFBundleVersion must be one to three period-separated INTEGERS. "0.0.0-dev" is not a
          # version as far as macOS is concerned, and it went into the bundle verbatim - so the
          # bundle version is the numeric part only, while artifact names keep the full string.
          NUMERIC="${V%%-*}"
          [[ "$NUMERIC" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || NUMERIC="0.0.0"
          echo "numeric=$NUMERIC" >> "$GITHUB_OUTPUT"
          echo "Bundle version: $NUMERIC"

      # The guard the engine's publish.yml has carried since 3.0.1, applied here for the first time.
      #
      # Its lesson: a release shipped the wrong version SILENTLY because a csproj bump had been
      # reverted by accident, and every downstream check reported success. Studio has the same shape
      # and a worse blind spot - the workflow stamps the version into the .parcel from the TAG, so
      # the installers are named correctly whatever the csproj says, while the application itself
      # reports Assembly.GetExecutingAssembly()'s version in its About panel and compares that
      # against the update feed. A mismatch produces artifacts called 3.0.0-rc.1 that call
      # themselves 3.0.0-dev, and the only place it shows is a corner of a settings window.
      #
      # A dispatch with an explicit version override is exempt: that run is deliberately building
      # something other than what the tree says.
      - name: Verify the csproj version matches the tag
        if: github.ref_type == 'tag' && github.event.inputs.version == ''
        shell: bash
        run: |
          set -euo pipefail

          # Two substitutions with a | delimiter and NO capture group, which is deliberate on
          # both counts. `grep -oP` is out because -P is a GNU extension and this job also runs
          # on macos-14, whose BSD grep refuses it - a guard that fails on a third of the
          # platforms it guards is worse than none. And a backreference is out because writing
          # one through a scripted edit is how a raw 0x01 byte got into this file and made
          # GitHub reject the whole workflow before a single job started.
          csproj=$(grep '<Version>' Tools/OutWit.Database.Studio/OutWit.Database.Studio.csproj \
            | head -1 | sed -e 's|.*<Version>||' -e 's|</Version>.*||')
          tag="${{ steps.ver.outputs.version }}"

          echo "csproj: $csproj"
          echo "tag:    $tag"

          if [ "$csproj" != "$tag" ]; then
            echo "::error::The Studio csproj says $csproj and the tag says $tag. The installers would be named for the tag while the application reported $csproj in its About panel and to the update check. Fix <Version> in OutWit.Database.Studio.csproj."
            exit 1
          fi

      - name: Patch .parcel (version, track, macOS signing)
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          set -euo pipefail

          # Always stamp the version. For the framework track, inject SelfContained=false
          # into ExtraBuildProperties — Parcel has no CLI flag for it, publish options come
          # from the .parcel.
          FILTER='.GeneralSettings.Version=$v'
          if [[ "${{ matrix.track }}" == "framework" ]]; then
            FILTER="$FILTER | .PublishSettings.ExtraBuildProperties.SelfContained=\"false\""
          fi

          # Developer-ID signing only when the certificate secret actually exists; the
          # committed .parcel says AdHoc so that a fork or a secretless run still packs.
          if [[ "${{ runner.os }}" == "macOS" && -n "${APPLE_CERT_P12_BASE64:-}" ]]; then
            FILTER="$FILTER | .MacOsSettings.SigningCredentialsType=\"P12Certificate\""
            FILTER="$FILTER | .MacOsSettings.SigningP12Certificate={\"\$type\":\"env\",\"name\":\"APPLE_CERT_PATH\"}"
            FILTER="$FILTER | .MacOsSettings.SigningP12Password={\"\$type\":\"env\",\"name\":\"APPLE_CERT_PASSWORD\"}"
            echo "macOS: Developer-ID signing enabled"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "::warning::APPLE_CERT_P12_BASE64 is not set - the macOS bundle will be ad-hoc signed and Gatekeeper will warn."
          fi

          # The numeric form, because this reaches CFBundleVersion on macOS.
          jq --arg v "${{ steps.ver.outputs.numeric }}" "$FILTER" \
            "$PARCEL_PROJECT" > "$PARCEL_PROJECT.tmp"
          mv "$PARCEL_PROJECT.tmp" "$PARCEL_PROJECT"
          cat "$PARCEL_PROJECT"

      # The macOS runner is tight on disk for a self-contained publish plus bundle copies.
      - name: Free up disk space (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* 2>/dev/null || true
          echo "After:"; df -h /

      # Apple Silicon SIGKILLs unsigned native binaries, and AspectInjector (pulled in by
      # OutWit.Common.Aspects, which Studio's models use for [Notify]) ships its osx-arm64
      # binary unsigned. Restore first to populate the cache, then ad-hoc sign it.
      - name: Ad-hoc codesign AspectInjector (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dotnet restore Tools/OutWit.Database.Studio/OutWit.Database.Studio.csproj -r ${{ matrix.rid }}
          find ~/.nuget/packages/aspectinjector -type f -name "AspectInjector" \
            -exec codesign --force --sign - {} \; 2>&1 || true

      - name: Prepare Apple Developer ID cert (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERT_P12_BASE64:-}" ]]; then
            echo "No Apple certificate secret; skipping."
            exit 0
          fi
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_cert.p12"
          echo "APPLE_CERT_PATH=$RUNNER_TEMP/apple_cert.p12" >> "$GITHUB_ENV"

      - name: Install Parcel CLI
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global AvaloniaUI.Parcel
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Pack (${{ matrix.packages }})
        shell: bash
        env:
          PARCEL_LICENSE_KEY: ${{ secrets.PARCEL_LICENSE_KEY }}
          AVALONIA_TOOLS_LICENSE_KEY: ${{ secrets.PARCEL_LICENSE_KEY }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Parcel's CLI takes repeated -p flags, NOT a comma-separated list.
          pkg_args=()
          for f in ${{ matrix.packages }}; do pkg_args+=( -p "$f" ); done

          parcel install-tools -r "${{ matrix.rid }}" "${pkg_args[@]}"
          parcel pack "$PARCEL_PROJECT" -r "${{ matrix.rid }}" "${pkg_args[@]}"

          echo "Packed:"
          find "$PARCEL_OUT" -type f | sort

      # THE FIX for the notarization rejection, and the reason it took four refuted hypotheses to find.
      #
      # Parcel seals the .app before the managed payload is accounted for: `codesign --verify --deep
      # --strict` on the packed bundle reports "a sealed resource is missing or invalid" followed by
      # 238 "file added:" lines - every .dll in Contents/MacOS/. CodeResources held 97 entries against
      # 255 files. The apphost's OWN signature is perfect (real Developer ID, hardened runtime, secure
      # timestamp, 31 of 31 page hashes intact) and so is every one of the 14 native binaries, which is
      # why every hypothesis about THEM was wrong. What is broken is the seal AROUND them, and Apple
      # reports a bundle whose seal fails through its main binary - hence "The signature of the binary
      # is invalid" pointing at Contents/MacOS/WitDatabaseStudio.
      #
      # So: re-sign the bundle once everything is in place. The nested code is already signed, so this
      # only recomputes CodeResources over the files that are actually there.
      - name: Re-seal the macOS bundle after packing
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -uo pipefail

          if [[ -z "${APPLE_CERT_PATH:-}" ]]; then
            echo "::warning::No Apple certificate - cannot re-seal, the bundle stays as Parcel left it."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/resign.keychain-db"
          PASS="$(uuidgen)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$APPLE_CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/Developer ID Application/{print $2; exit}')

          if [[ -z "$IDENTITY" ]]; then
            echo "::warning::No Developer ID Application identity in the keychain - not re-sealing."
            security find-identity -v "$KEYCHAIN" || true
            exit 0
          fi
          echo "Re-sealing with: $IDENTITY"

          # Hardened runtime forbids by default exactly what a .NET application needs: a JIT, writable
          # executable memory, and loading libraries signed by another identity. Without these the
          # bundle notarizes and then refuses to launch, which is a worse outcome than not notarizing.
          ENT="$RUNNER_TEMP/entitlements.plist"
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
            <key>com.apple.security.network.client</key><true/>
            <key>com.apple.security.network.server</key><true/>
          </dict></plist>
          PLIST

          # Absolute, because the re-zip runs from inside $WORK.
          ZIP=$(cd "$(dirname "$(find "$PARCEL_OUT" -name '*.zip' | head -1)")" && pwd)/$(basename "$(find "$PARCEL_OUT" -name '*.zip' | head -1)")
          echo "Archive: $ZIP"

          WORK="$RUNNER_TEMP/reseal"
          rm -rf "$WORK" && mkdir -p "$WORK"
          ditto -x -k "$ZIP" "$WORK"

          APP=$(find "$WORK" -maxdepth 1 -name '*.app' | head -1)
          if [[ -z "$APP" ]]; then
            echo "::warning::no .app bundle to re-seal"
            exit 0
          fi

          APPHOST="$APP/Contents/MacOS/WitDatabaseStudio"

          # Bottom-up, and deliberately NOT --deep, which Apple discourages and which signs the wrong
          # things in the wrong order. The sequence is the one the WitCloud client arrived at the hard
          # way, and it turns on a fact that is easy to get wrong: codesign treats EVERY file in
          # Contents/MacOS/ as a subcomponent that must be SIGNED, not merely sealed - dylibs, the
          # managed PE assemblies, and the data files (.deps.json, .runtimeconfig.json) alike. Signing
          # only the bundle leaves them unsigned and the seal still fails.
          echo "--- 1/3: every file in Contents/MacOS except the apphost ---"
          find "$APP/Contents/MacOS" -type f ! -path "$APPHOST" \
            -exec codesign --force --timestamp --options runtime --sign "$IDENTITY" {} +

          echo "--- 2/3: the apphost, with entitlements ---"
          codesign --force --timestamp --options runtime --entitlements "$ENT" \
            --sign "$IDENTITY" "$APPHOST"

          echo "--- 3/3: the bundle itself, last ---"
          codesign --force --timestamp --options runtime --entitlements "$ENT" \
            --sign "$IDENTITY" "$APP"

          echo "--- verifying the re-sealed bundle ---"
          if codesign --verify --strict --verbose=2 "$APP" 2>&1 | tail -8; then
            echo "Re-seal verified."
          else
            echo "::warning::the re-sealed bundle still does not verify - see above."
          fi

          # ditto, not zip: it is what Apple expects for a bundle in an archive.
          rm -f "$ZIP"
          ( cd "$WORK" && ditto -c -k --keepParent "$(basename "$APP")" "$ZIP" )
          echo "Re-packaged: $ZIP"

      # Apple's verdict costs a round trip and comes back as one line. codesign and spctl are the same
      # validators, on this machine, for free - so ask them BEFORE submitting and print what they say.
      #
      # This exists because four hypotheses about the rejection were tested against the artifact and
      # all four were wrong: the apphost carries a real Developer ID identity, hardened runtime, a
      # secure timestamp, and 31 of 31 intact page hashes, and all 14 native binaries in the bundle
      # are signed the same way. Whatever Apple objects to is something only its own validator sees,
      # and this is where it becomes visible.
      - name: Verify the signature locally before submitting (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          ZIP=$(find "$PARCEL_OUT" -name '*.zip' | head -1)
          WORK="$RUNNER_TEMP/verify"
          rm -rf "$WORK" && mkdir -p "$WORK"
          ditto -x -k "$ZIP" "$WORK"

          APP=$(find "$WORK" -maxdepth 1 -name '*.app' | head -1)
          echo "Verifying $APP"

          echo "--- codesign --verify --deep --strict ---"
          codesign --verify --deep --strict --verbose=4 "$APP" 2>&1 || echo "(codesign reported the above)"

          echo "--- codesign -dvvv (main binary) ---"
          codesign -dvvv "$APP" 2>&1 | head -30 || true

          echo "--- spctl assessment (what Gatekeeper would say) ---"
          spctl -a -t exec -vvv "$APP" 2>&1 || echo "(spctl reported the above; 'rejected' is expected before notarization)"

          echo "--- CFBundleVersion ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist" 2>&1 || true

      # The first run of this step submitted, waited, and reported success while Apple had answered
      # "Invalid" - notarytool's exit code does not follow the verdict, and nothing here read it. A
      # step that cannot fail is not a check. This one reads the status, fetches the reason, and
      # staples the ticket into the bundle when Apple accepts.
      - name: Notarize + staple (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_APP_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]]; then
            echo "::warning::Apple notarization secrets absent - shipping un-notarized."
            exit 0
          fi

          ZIP=$(find "$PARCEL_OUT" -name '*.zip' | head -1)
          echo "Submitting $ZIP to notarytool"

          # --output-format json so the verdict can be read rather than eyeballed.
          RESULT=$(xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json \
            --wait) || true

          echo "$RESULT"

          STATUS=$(echo "$RESULT" | jq -r '.status // "unknown"')
          SUBMISSION=$(echo "$RESULT" | jq -r '.id // empty')

          echo "Notarization status: $STATUS"

          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::warning::Notarization returned '$STATUS' - the bundle is signed but NOT notarized, so Gatekeeper will warn on first launch."

            # The reason lives in the submission log, not in the submit output. Print it, or the
            # next person has the same three words to work from that this run had.
            if [[ -n "$SUBMISSION" ]]; then
              echo "--- notarization log for $SUBMISSION ---"
              xcrun notarytool log "$SUBMISSION" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || echo "(could not fetch the log)"
            fi
            exit 0
          fi

          # Accepted: staple the ticket into the .app so it validates offline, and re-zip.
          WORK="$RUNNER_TEMP/staple"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$ZIP" -d "$WORK"

          APP=$(find "$WORK" -maxdepth 1 -name '*.app' | head -1)
          if [[ -z "$APP" ]]; then
            echo "::warning::no .app bundle found to staple"
            exit 0
          fi

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

          rm -f "$ZIP"
          ( cd "$WORK" && ditto -c -k --keepParent "$(basename "$APP")" "$OLDPWD/$ZIP" )
          echo "Stapled and re-packaged: $ZIP"

      # Decide whether to sign, and DEFAULT TO NOT SIGNING. The first version of this gate defaulted
      # the other way - it only skipped when the tag looked internal, so a workflow_dispatch from main
      # (ref name "main", matching none of the internal patterns) went straight to signing and would
      # have spent quota on a throwaway build.
      - name: Decide Windows signing
        id: signgate
        if: runner.os == 'Windows'
        shell: bash
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
        run: |
          set -euo pipefail
          should=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.sign }}" == "true" ]]; then
            should=true
          fi

          # The eSigner tier is quota-limited (~240/yr): public tags are signed, internal
          # iteration tags are not.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            case "${{ github.ref_name }}" in
              *-dev*|*-test*|*-internal*) : ;;
              *) should=true ;;
            esac
          fi

          if [[ -z "${ESIGNER_USERNAME:-}" ]]; then
            [[ "$should" == "true" ]] && echo "::warning::Windows signing requested but ESIGNER_* secrets are not set - shipping UNSIGNED."
            should=false
          fi

          echo "should_sign=$should" >> "$GITHUB_OUTPUT"
          echo "Windows signing: should_sign=$should"

      - name: Locate the installer to sign
        id: exe
        if: runner.os == 'Windows' && steps.signgate.outputs.should_sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(find "$PARCEL_OUT" -name '*.exe' | head -1)
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "Installer: $EXE"

      # The official action rather than `docker run ghcr.io/sslcom/codesigner`: the windows-latest
      # runner's Docker daemon is in WINDOWS CONTAINER mode, and that image is Linux-only, so the
      # raw docker call dies with "no matching manifest for windows(10.0.26100)/amd64" (exit 125).
      #
      # continue-on-error because a signing failure must never destroy the build. The first run of
      # this pipeline lost BOTH Windows artifacts to that docker error - the packages were built and
      # then thrown away because a later step failed. Unsigned-and-shipped beats signed-and-absent.
      - name: Sign Windows installer (SSL.com eSigner)
        id: sign
        if: runner.os == 'Windows' && steps.signgate.outputs.should_sign == 'true'
        continue-on-error: true
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ESIGNER_USERNAME }}
          password: ${{ secrets.ESIGNER_PASSWORD }}
          credential_id: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ESIGNER_TOTP_SECRET }}
          file_path: ${{ github.workspace }}/${{ steps.exe.outputs.path }}
          output_path: ${{ runner.temp }}/signed
          malware_block: 'false'
          environment_name: PROD

      - name: Replace the installer with the signed copy
        if: runner.os == 'Windows' && steps.signgate.outputs.should_sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXE="${{ steps.exe.outputs.path }}"
          SIGNED="$RUNNER_TEMP/signed/$(basename "$EXE")"

          if [[ -f "$SIGNED" ]]; then
            mv -f "$SIGNED" "$EXE"
            echo "Replaced the installer with the signed copy."
          else
            # Say so rather than shipping a silently-unsigned installer.
            echo "::warning::Windows signing did not produce a signed file - shipping UNSIGNED."
          fi

      - name: Rename artifacts for the track
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"

          find "$PARCEL_OUT" -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.dmg' -o -name '*.rpm' \) | while read -r f; do
            EXT="${f##*.}"
            cp "$f" "$STAGE/WitDatabaseStudio-${V}-${{ matrix.oslabel }}${SUFFIX}.${EXT}"
          done

          echo "Staged:"
          ls -la "$STAGE"

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stage"
          if command -v sha256sum >/dev/null; then
            sha256sum * > "SHA256SUMS-${{ matrix.oslabel }}${{ matrix.suffix }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.oslabel }}${{ matrix.suffix }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.oslabel }}${{ matrix.suffix }}.txt"

      - name: GPG-sign SHA256SUMS (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "::warning::GPG_PRIVATE_KEY absent - SHA256SUMS ships unsigned."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd "$RUNNER_TEMP/stage"
          SUMS="SHA256SUMS-${{ matrix.oslabel }}${{ matrix.suffix }}.txt"
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --armor --detach-sign "$SUMS"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.oslabel }}${{ matrix.suffix }}
          path: ${{ runner.temp }}/stage/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    # The build matrix lets macOS fail without blocking, so this must run even then -
    # but not when the whole matrix was cancelled.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Collect and report what actually built
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find ./artifacts -type f -exec cp {} release-files/ \;

          echo "Release files:"
          ls -la release-files/

          # A release that quietly ships fewer platforms than it claims is the failure this
          # pipeline exists to stop repeating - v1.0.1 shipped two of three and said nothing.
          for os in windows-x64 linux-x64 macos-arm64; do
            if ls release-files/ | grep -q "$os"; then
              echo "  present: $os"
            else
              echo "::warning::NO ARTIFACT FOR $os - this release does not cover it."
            fi
          done

          if [ -z "$(ls -A release-files/)" ]; then
            echo "::error::no artifacts at all - refusing to create an empty release"
            exit 1
          fi

      - name: Resolve release name
        id: name
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="studio-v${{ github.event.inputs.version || '0.0.0-dev' }}"
          fi

          VERSION="${TAG#studio-v}"

          # A version carrying a pre-release suffix - 3.0.0-dev.1, 2.1.0-beta, 2.1.0-rc.2 - is never
          # the repository's Latest. This has to be derived from the TAG, not from the dispatch input:
          # on a tag push that input does not exist, so it evaluated to 'false' and make_latest to
          # 'true' - an internal dev build, unsigned on Windows because the signing gate correctly
          # skips '-dev', would have been presented as the current release and displaced 2.0.0.
          #
          # Same shape as the signing gate one job up, and the same rule: the safe answer is the
          # default, and only an explicit public tag opts out of it.
          case "$VERSION" in
            *-*) PRE=true ;;
            *)   PRE=false ;;
          esac

          # The dispatch input can only make a run MORE cautious, never less.
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            PRE=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=WitDatabase Studio $VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Release $TAG - prerelease=$PRE, latest=$([[ "$PRE" == "true" ]] && echo false || echo true)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          name: ${{ steps.name.outputs.name }}
          draft: false
          prerelease: ${{ steps.name.outputs.prerelease }}
          # A real (non-prerelease) Studio release becomes the repository's Latest. Nothing is
          # displaced by that: the engine ships to NuGet and publishes no GitHub releases.
          make_latest: ${{ steps.name.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: release-files/*
          generate_release_notes: true
          fail_on_unmatched_files: true
